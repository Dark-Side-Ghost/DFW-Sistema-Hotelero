spring.application.name=hotel-api

# Lee un archivo .env (si existe en la carpeta backend/) con DB_USER, DB_PASSWORD y JWT_SECRET.
# El archivo .env NO se sube a GitHub (esta en .gitignore). Ver .env.example
spring.config.import=optional:file:.env[.properties]
server.port=8080

# ---------- Base de datos (MySQL) ----------
# Usuario y clave se pueden cambiar con variables de entorno DB_USER / DB_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/El_Salvador
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# update = si falta alguna tabla/columna la crea; el script database/hotel_db.sql es la fuente oficial
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JWT ----------
# La clave debe tener al menos 32 caracteres. Define la tuya en .env o en la variable de entorno JWT_SECRET.
# El valor por defecto (despues de los dos puntos) es SOLO para desarrollo y es publico en GitHub
app.jwt.secret=${JWT_SECRET:8-L3-NIbdEi3_gpugY6oAtsSKDiPEjLkUuPA7oDK_-FZJyI7OIsqBPNFUvkxxG7m}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# ---------- CORS (frontend React en Vite) ----------
app.cors.origins=http://localhost:5173,http://127.0.0.1:5173

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
